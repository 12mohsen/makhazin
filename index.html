<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام المخازن والمشتريات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f3f5fb;--surface:#ffffff;--surface2:#f7f9fc;--text:#0f172a;--muted:#4b5568;--border:#e4e8f1;--primary:#4f46e5;--primary2:#7c3aed;--primary-soft:#eef0ff;--ok:#059669;--ok-soft:#d1fae5;--warn:#d97706;--warn-soft:#fef3c7;--bad:#dc2626;--bad-soft:#fee2e2;--info:#0284c7;--info-soft:#e0f2fe;--shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px rgba(15,23,42,.06);--r:16px}
[data-theme=dark]{color-scheme:dark;--bg:#0a0f1e;--surface:#121a2f;--surface2:#0e1528;--text:#e6eaf5;--muted:#b3bcd6;--border:#232d4a;--primary:#818cf8;--primary2:#a78bfa;--primary-soft:#1d2450;--ok:#34d399;--ok-soft:#06372a;--warn:#fbbf24;--warn-soft:#3a2a06;--bad:#f87171;--bad-soft:#3d1014;--info:#38bdf8;--info-soft:#082f49;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;transition:background .25s,color .25s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--primary)}
.hidden{display:none!important}
.muted{color:var(--muted)}.center{text-align:center}.small{font-size:13px}.bold{font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.grow{flex:1}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{cursor:pointer;padding:10px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border:0}
.btn.ok{background:var(--ok);color:#fff;border:0}.btn.bad{background:var(--bad);color:#fff;border:0}.btn.warn{background:var(--warn);color:#fff;border:0}
.btn.ghost{background:transparent}.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn.lg{padding:14px 20px;font-size:17px}.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{border:1px solid var(--border);background:var(--surface);width:38px;height:38px;border-radius:11px;cursor:pointer;display:inline-grid;place-items:center;font-size:17px}
.icon-btn:hover{background:var(--primary-soft)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=email],input[type=number],input[type=password],input[type=date],input[type=tel],input[type=search],input:not([type]),select,textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--primary)}
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-hero{background:linear-gradient(145deg,#312e81,#6d28d9 55%,#db2777);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.auth-hero:before,.auth-hero:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.auth-hero:before{width:420px;height:420px;top:-120px;left:-120px}.auth-hero:after{width:300px;height:300px;bottom:-80px;right:-60px}
.auth-hero h1{font-size:42px;font-weight:800;line-height:1.3;margin-bottom:14px;position:relative}
.auth-hero p{opacity:.85;font-size:18px;position:relative;max-width:460px}
.auth-hero ul{list-style:none;margin-top:28px;display:grid;gap:12px;position:relative}
.auth-hero li{background:rgba(255,255,255,.1);padding:12px 16px;border-radius:12px;backdrop-filter:blur(4px)}
.auth-box{display:grid;place-items:center;padding:30px}
.auth-card{width:100%;max-width:420px;background:var(--surface);padding:34px;border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--border)}
.auth-card h2{font-size:26px;margin-bottom:6px}
.tabs{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px;margin:18px 0}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
@media(max-width:860px){.auth{grid-template-columns:1fr}.auth-hero{padding:34px}.auth-hero h1{font-size:30px}.auth-hero ul{display:none}}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--surface);border-left:1px solid var(--border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;font-size:22px;color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.brand b{font-size:17px;display:block}.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--text);text-decoration:none;font-weight:500;transition:.15s}
.nav a .ni{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--surface2);font-size:15px}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--primary-soft);color:var(--primary);font-weight:700}
.nav a.on .ni{background:linear-gradient(135deg,var(--primary),var(--primary2))}
.nav a .cnt{margin-inline-start:auto;background:var(--bad);color:#fff;font-size:11px;padding:1px 7px;border-radius:20px;animation:badgePulse 1.4s ease-in-out infinite}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}50%{box-shadow:0 0 0 5px rgba(239,68,68,0)}}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center;line-height:2}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top h1{font-size:20px;font-weight:800}
.top .sp{flex:1}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border:1px solid var(--border);border-radius:14px;cursor:pointer;background:var(--surface2)}
.avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#06b6d4,#6366f1);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.user-chip small{display:block;color:var(--muted);font-size:11px}
.content{padding:24px 26px;flex:1}
#menuBtn{display:none}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{position:fixed;right:0;z-index:60;width:270px;transform:translateX(110%);transition:.25s;box-shadow:var(--shadow)}.side.open{transform:none}#menuBtn{display:inline-grid}.content{padding:16px}.top{padding:12px 16px}.user-chip .uinfo,.clock{display:none}}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.kpi .ki{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;margin-bottom:10px}
.kpi .kv{font-size:24px;font-weight:800}
.kpi .kl{color:var(--muted);font-size:13px}
.c1 .ki{background:var(--primary-soft)}.c2 .ki{background:var(--ok-soft)}.c3 .ki{background:var(--warn-soft)}.c4 .ki{background:var(--bad-soft)}.c5 .ki{background:var(--info-soft)}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.page-h .grow{min-width:180px}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface2);font-size:13px;color:var(--muted);font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.num{font-variant-numeric:tabular-nums}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty .ei{font-size:44px;margin-bottom:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:30px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}.badge.pri{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.modal-bg{position:fixed;inset:0;background:rgba(8,12,28,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s}
.modal.wide{max-width:980px}.modal.mid{max-width:720px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-h h3{font-size:18px}
.modal-b{padding:20px;overflow-y:auto}
.modal-f{display:flex;gap:10px;justify-content:flex-start;padding-top:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.96);opacity:0}}
#toasts{position:fixed;bottom:20px;left:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-weight:600;animation:pop .2s;max-width:340px}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#fff}
.pos{display:grid;grid-template-columns:1fr 410px;gap:16px;height:calc(100vh - 115px)}
.pos>.card{display:flex;flex-direction:column;min-height:0;min-width:0}
@media(max-width:1100px){.pos{grid-template-columns:1fr;height:auto}.pgrid{max-height:55vh}}
.scanbar{display:flex;gap:8px;margin-bottom:12px}
.scanbar input{font-size:17px;padding:13px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{border:1px solid var(--border);background:var(--surface2);padding:6px 14px;border-radius:30px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px;overflow-y:auto;padding:2px;align-content:start;flex:1}
.ptile{border:1px solid var(--border);background:var(--surface2);border-radius:14px;padding:12px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px;text-align:right}
.ptile:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.pa{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0}
.ptile .pn{font-weight:700;font-size:14px;line-height:1.35;min-height:38px}
.ptile .pp{color:var(--primary);font-weight:800}
.ptile.out{opacity:.5}
.cart-list{flex:1;overflow-y:auto;margin:0 -6px;padding:0 6px;min-height:120px}
.cline{display:grid;grid-template-columns:1fr auto;gap:6px;padding:10px 0;border-bottom:1px dashed var(--border)}
.cline .cn{font-weight:700}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-weight:800}
.qty input{width:52px;text-align:center;padding:4px}
.totals{border-top:1px solid var(--border);padding-top:10px;margin-top:6px;display:grid;gap:5px}
.totals .tr{display:flex;justify-content:space-between;gap:10px}
.totals .grand{font-size:26px;font-weight:800;color:var(--primary);padding-top:6px;border-top:1px dashed var(--border)}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.paytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.paytab{border:2px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;text-align:center;background:var(--surface2);font-weight:700}
.paytab .pi{font-size:26px;display:block;margin-bottom:4px}
.paytab.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.bigtotal{text-align:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;margin-bottom:16px}
.bigtotal b{font-size:32px;display:block}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.change{font-size:22px;font-weight:800;text-align:center;padding:12px;border-radius:12px;background:var(--ok-soft);color:var(--ok)}
.change.neg{background:var(--bad-soft);color:var(--bad)}
.cam-box{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:grid;place-items:center}
.cam-box video{width:100%;height:100%;object-fit:cover}
#camq{width:100%}
.cam-line{position:absolute;left:10%;right:10%;height:2px;background:#ef4444;box-shadow:0 0 12px #ef4444;top:50%;animation:scan 1.6s ease-in-out infinite;pointer-events:none}
@keyframes scan{0%,100%{top:30%}50%{top:70%}}
canvas.chart{width:100%;height:240px;display:block}
.bar-list .bl{display:grid;grid-template-columns:1fr auto;gap:4px;margin-bottom:10px}
.bar-list .bt{height:8px;border-radius:8px;background:var(--surface2);overflow:hidden;grid-column:1/-1}
.bar-list .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:8px}
.perm-tbl td,.perm-tbl th{text-align:center}.perm-tbl td:first-child,.perm-tbl th:first-child{text-align:right}
.perm-tbl input{width:18px;height:18px;accent-color:var(--primary)}
.alert{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;margin-bottom:14px}
.alert.info{background:var(--info-soft);color:var(--info)}
.items-tbl input{padding:6px 8px;min-width:80px}
.kbd{font-family:monospace;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 6px;font-size:12px}
.stock-alert{position:relative;border-radius:18px;padding:16px 18px;margin-bottom:16px;border:2px solid var(--bad);background:linear-gradient(135deg,var(--bad-soft),var(--surface) 70%);animation:alertGlow 1.4s ease-in-out infinite}
.stock-alert.warn{border-color:var(--warn);background:linear-gradient(135deg,var(--warn-soft),var(--surface) 70%);animation-name:alertGlowW}
.stock-alert.good{border-color:var(--ok);background:linear-gradient(135deg,var(--ok-soft),var(--surface) 70%);animation:none;padding:12px 16px}
@keyframes alertGlow{0%,100%{border-color:#dc2626;box-shadow:0 0 0 0 rgba(239,68,68,.0),0 0 0 0 rgba(239,68,68,.0)}50%{border-color:#ff6b6b;box-shadow:0 0 0 4px rgba(239,68,68,.55),0 0 28px 6px rgba(239,68,68,.55)}}
@keyframes alertGlowW{0%,100%{border-color:#d97706;box-shadow:0 0 0 0 rgba(245,158,11,0),0 0 0 0 rgba(245,158,11,0)}50%{border-color:#fbbf24;box-shadow:0 0 0 4px rgba(245,158,11,.55),0 0 28px 6px rgba(245,158,11,.5)}}
.stock-alert .sa-ic{font-size:34px;animation:shake 1.6s ease-in-out infinite;display:inline-block}
@keyframes shake{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(12deg)}95%{transform:rotate(-8deg)}}
.stock-alert h3{font-size:18px;margin:0}
.sa-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.sa-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:30px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent}
.sa-chip.out{background:var(--bad);color:#fff}.sa-chip.low{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.sa-chip b{background:rgba(255,255,255,.25);padding:0 7px;border-radius:20px}
tr.row-out td{background:color-mix(in srgb,var(--bad-soft) 70%,transparent)}tr.row-out td:first-child{box-shadow:inset -4px 0 0 var(--bad)}
tr.row-low td{background:color-mix(in srgb,var(--warn-soft) 55%,transparent)}tr.row-low td:first-child{box-shadow:inset -4px 0 0 var(--warn)}
.qty-big{font-size:14px;padding:4px 12px}
.pp{position:relative}
.pp-list{position:absolute;inset-inline:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:260px;overflow-y:auto}
.pp-item{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.pp-item:last-child{border-bottom:0}.pp-item:hover,.pp-item.on{background:var(--primary-soft)}
.pp-item .pa{width:30px;height:30px;font-size:13px;border-radius:9px}
.pp-sel{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:2px solid var(--ok);background:var(--ok-soft)}
mark{background:var(--warn-soft);color:inherit;border-radius:4px;padding:0 2px}
.cs-native{display:none!important}
.cs-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;text-align:right;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s,background .15s;min-height:42px}
.cs-btn:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border))}
.cs-btn.open,.cs-btn:focus-visible{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);outline:none}
.cs-btn:disabled{opacity:.55;cursor:not-allowed}
.cs-btn.ph .cs-label{color:var(--muted)}
.cs-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cs-chev{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary);transition:transform .2s}
.cs-btn.open .cs-chev{transform:rotate(180deg)}
.cs-panel{position:fixed;z-index:400;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 24px 60px rgba(2,6,23,.45),0 2px 6px rgba(2,6,23,.2);padding:6px;overflow:auto;animation:csIn .14s ease-out;max-width:min(440px,calc(100vw - 24px));direction:rtl}
@keyframes csIn{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.cs-opt{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background .1s}
.cs-opt:hover,.cs-opt.on{background:var(--surface2)}
.cs-opt.sel{background:var(--primary-soft);color:var(--primary);font-weight:700}
.cs-opt .ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:#fff;font-size:12px;flex:0 0 auto}
.cs-opt small{color:var(--muted);font-family:monospace;font-weight:400}
.cs-opt.dis{opacity:.45;pointer-events:none}
.cs-empty{padding:14px;text-align:center;color:var(--muted)}

 {code:'YER',name:'ريال يمني',sym:'ر.ي',dec:0},{code:'SDG',name:'جنيه سوداني',sym:'ج.س',dec:2},{code:'MAD',name:'درهم مغربي',sym:'د.م',dec:2},{code:'TND',name:'دينار تونسي',sym:'د.ت',dec:3},
 {code:'DZD',name:'دينار جزائري',sym:'د.ج',dec:2},{code:'LBP',name:'ليرة لبنانية',sym:'ل.ل',dec:0},{code:'SYP',name:'ليرة سورية',sym:'ل.س',dec:0},{code:'TRY',name:'ليرة تركية',sym:'₺',dec:2},
 {code:'GBP',name:'جنيه إسترليني',sym:'£',dec:2},{code:'INR',name:'روبية هندية',sym:'₹',dec:2},{code:'PKR',name:'روبية باكستانية',sym:'Rs',dec:0},{code:'BDT',name:'تاكا بنغلاديشي',sym:'৳',dec:2},
 {code:'MYR',name:'رينغيت ماليزي',sym:'RM',dec:2},{code:'PHP',name:'بيزو فلبيني',sym:'₱',dec:2},{code:'THB',name:'بات تايلندي',sym:'฿',dec:2},{code:'CNY',name:'يوان صيني',sym:'¥',dec:2},
 {code:'JPY',name:'ين ياباني',sym:'¥',dec:0},{code:'KRW',name:'وون كوري',sym:'₩',dec:0},{code:'LKR',name:'روبية سريلانكية',sym:'Rs',dec:2},{code:'NPR',name:'روبية نيبالية',sym:'Rs',dec:2},

function rebuildI18N(){const U=(typeof DB!=='undefined'&&DB&&DB.settings&&DB.settings.nameTr)||{};

/* ---------- Code128-B barcode (SVG) ---------- */
const C128='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 2331112'.split(' ');
function code128SVG(text,h=50){text=String(text).replace(/[^\x20-\x7E]/g,'');if(!text)return'';const codes=[104];for(const ch of text)codes.push(ch.charCodeAt(0)-32);let sum=104;for(let i=1;i<codes.length;i++)sum+=codes[i]*i;codes.push(sum%103);codes.push(106);let x=10,bars='';for(const c of codes){const p=C128[c];for(let i=0;i<p.length;i++){const w=+p[i];if(i%2===0)bars+=`<rect x="${x}" y="0" width="${w}" height="${h}"/>`;x+=w}}x+=10;return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x} ${h}" preserveAspectRatio="none" class="bc">${bars}</svg>`}
function genBarcode(){let c;do{let b='62'+String(Math.floor(Math.random()*1e10)).padStart(10,'0');let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);c=b+((10-s%10)%10)}while(findByCode(c));return c}

/* ---------- Barcode readers ---------- */
/* لوحة المفاتيح العربية تحوّل أحرف الباركود إلى حروف عربية — نعيدها للإنجليزية */
const AR2EN={'ض':'q','ص':'w','ث':'e','ق':'r','ف':'t','غ':'y','ع':'u','ه':'i','خ':'o','ح':'p','ش':'a','س':'s','ي':'d','ب':'f','ل':'g','ا':'h','ت':'j','ن':'k','م':'l','ئ':'z','ء':'x','ؤ':'c','ر':'v','ى':'n','ة':'m','ظ':'/','ط':"'",'ذ':'`','د':']','ج':'[','و':',','ز':'.','ك':';','لا':'b','÷':'H','×':'J','؛':'K','،':'L','؟':'?','’':'M'};
const fixLayout=s=>String(s??'').replace(/لا/g,'b').replace(/[؀-ۿ÷×’]/g,ch=>AR2EN[ch]??ch);
/* البحث بالباركود: يطابق مع تجاهل حالة الأحرف والأصفار البادئة (EAN/UPC) واختلاف لغة لوحة المفاتيح */
function findByCode(c){c=normCode(c);if(!c)return null;
 const dec=asciiDecode(c);const tries=[c,fixLayout(c).trim()].concat(dec?[dec]:[]);for(const t of tries){const u=t.toUpperCase();const p=DB.products.find(p=>p.barcode&&(p.barcode===t||p.barcode.toUpperCase()===u))||DB.products.find(p=>(p.altCodes||[]).some(a=>a===t||String(a).toUpperCase()===u));if(p)return p}
 const d=tries.map(t=>t.replace(/^0+/,'')).filter(t=>/^\d{6,}$/.test(t));
 return d.length?DB.products.find(p=>p.barcode&&/^\d+$/.test(p.barcode)&&d.includes(p.barcode.replace(/^0+/,''))):null}

const keyChar=e=>{const c=e.code||'';if(/^Digit\d$/.test(c))return c[5];if(/^Numpad\d$/.test(c))return c[6];if(/^Key[A-Z]$/.test(c))return e.shiftKey?c[3]:c[3].toLowerCase();return e.key&&e.key.length===1?fixLayout(e.key):''};
/* بعض القارئات (مثل U2) تكتب كل حرف بطريقة Alt + رقمه على لوحة الأرقام — نفك هذه الأكواد */
let altNum='';
function decodeKey(e){
 if(e.type==='keyup'){if(e.key==='Alt'&&altNum){const v=parseInt(altNum,10);altNum='';const c=String.fromCharCode(v>255?v:v);return /[\r\n\t]/.test(c)?{end:'Alt+'+v}:(c>=' '?{ch:c}:null)}return null}
 if(e.key==='Alt'){altNum='';return{alt:true}}
 if(e.altKey&&/^Numpad\d$/.test(e.code||'')){altNum+=e.code[6];return{alt:true}}
 if(e.key==='Enter'||e.key==='Tab'||e.key==='NumpadEnter')return{end:e.key};
 const ch=keyChar(e);return ch?{ch}:null}
/* احتياط: إذا وصل الباركود كسلسلة أكواد ASCII (مثل 5450…) نحوّلها للنص الأصلي */
function asciiDecode(s){if(!/^\d{8,}$/.test(s))return null;let out='',i=0;while(i<s.length){const n=s[i]==='1'?3:2;const v=+s.substr(i,n);if(!(v>=32&&v<=126)||i+n>s.length)return null;out+=String.fromCharCode(v);i+=n}return /^[0-9A-Za-z\-_.]+$/.test(out)?out:null}
function cleanScan(v){v=normCode(v);const d=asciiDecode(v);return d&&!DB.products.some(p=>p.barcode===v)?d:v}
/* قارئ باركود USB (وضع لوحة المفاتيح): يُلتقط في أي صفحة، مع أو بدون Enter في نهاية المسح */
let scanHandler=null,scanBuf='',scanT=0,scanFast=0,scanIdle=null;
const SCAN_GAP=50;/* القارئ يكتب الحرف كل 1–30 ملّي ثانية تقريباً؛ الإنسان أبطأ بكثير */
function flushScan(){clearTimeout(scanIdle);const c=scanBuf;scanBuf='';scanFast=0;if(c.length>=3)deliverScan(c,'kbd-global')}
function globalScanKey(e){
 if(window.__scanTest){window.__scanTest(e);return}
 const r=decodeKey(e);if(!r)return;
 const top=$$('.modal-bg').pop();if(top&&!$$('input',top).some(x=>x.__onScan))return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
 const now=Date.now(),gap=now-scanT;scanT=now;
 if(gap>150){scanBuf='';scanFast=0}else if(gap<=SCAN_GAP)scanFast++;
 if(r.alt)return;
 if(r.end){if(scanBuf.length>=3){e.preventDefault();flushScan()}else scanBuf='';return}
 scanBuf+=r.ch;
 clearTimeout(scanIdle);scanIdle=setTimeout(()=>{if(scanBuf.length>=4&&scanFast>=3)flushScan();else{scanBuf='';scanFast=0}},180)}
document.addEventListener('keydown',globalScanKey,true);document.addEventListener('keyup',globalScanKey,true);
/* قارئات وضع Alt ترسل Enter قبل أن يكتمل إدخال الأرقام في الخانة — نؤخر معالجة Enter قليلاً في خانات الباركود */
document.addEventListener('keydown',e=>{if(!e.isTrusted||e.__def||(e.key!=='Enter'&&e.key!=='NumpadEnter'))return;const t=e.target;if(!t||!t.__onScan)return;
 e.preventDefault();e.stopImmediatePropagation();setTimeout(()=>{const ev=new KeyboardEvent('keydown',{key:'Enter',code:'Enter',bubbles:true,cancelable:true});ev.__def=1;t.dispatchEvent(ev)},150)},true);
/* خانات إدخال الباركود: تقبل نهاية المسح بـ Enter أو Tab أو بدون أي لاحقة */
function bindScanInput(inp,onCode,opt={}){let t0=0,fast=0,start=0,idle;inp.__onScan=onCode;
 const fire=()=>{clearTimeout(idle);const v=cleanScan(inp.value.slice(start));fast=0;if(v.length>=3){inp.value=inp.value.slice(0,start);inp.dispatchEvent(new Event('input'));onCode(v)}};
 inp.addEventListener('keydown',e=>{const n=Date.now(),gap=n-t0;t0=n;
  if(e.key==='Enter'||e.key==='NumpadEnter'){if(opt.enterFires&&fast>=3){e.preventDefault();fire();return}clearTimeout(idle);fast=0;return}
  if(e.key==='Tab'&&fast>=3){e.preventDefault();fire();return}
  if(e.key.length!==1&&!(e.altKey&&/^Numpad/.test(e.code||''))&&e.key!=='Alt')return;
  if(gap>150){fast=0;start=inp.selectionStart??inp.value.length;if(inp.selectionEnd>start)start=0}
  if(gap<=SCAN_GAP)fast++;
  clearTimeout(idle);idle=setTimeout(()=>{if(fast>=3)fire();else fast=0},180)})}
/* توزيع الرمز المقروء على المكان المناسب (الخانة النشطة، نافذة مفتوحة، أو الصفحة) */
function deliverScan(code,src){code=cleanScan(code);if(!code)return;
 if(window.__scanTestCode){window.__scanTestCode(code,src);return}
 const a=document.activeElement;if(a&&a.__onScan){a.__onScan(code);return}
 const top=$$('.modal-bg').pop();if(top){const i=$$('input',top).find(x=>x.__onScan);if(i){i.__onScan(code);return}return}

/* قارئ USB في وضع COM / Serial (لا يكتب كلوحة مفاتيح) — عبر Web Serial في Chrome/Edge */
let serialPort=null,serialReader=null;
const serialOK=()=>'serial' in navigator;
async function connectSerial(ask=true){
 if(!serialOK())return toast('المتصفح لا يدعم هذا — استخدم Google Chrome أو Microsoft Edge','bad');
 try{let port=ask?await navigator.serial.requestPort():(await navigator.serial.getPorts())[0];if(!port)return;
  await disconnectSerial(true);const baud=+(localStorage.getItem('mk_baud')||9600);
  await port.open({baudRate:baud});serialPort=port;localStorage.setItem('mk_serial_v2','1');
  if(ask)toast('✅ تم توصيل القارئ (COM) — سرعة '+baud,'ok');readSerial(port);updSerialUI();
 }catch(e){if(e&&e.name==='NotFoundError')return;toast('تعذّر فتح المنفذ: '+(e.message||e)+' — تأكد أن برنامجاً آخر لا يستخدم القارئ','bad')}}
async function disconnectSerial(silent){try{if(serialReader){await serialReader.cancel()}}catch(e){}try{if(serialPort)await serialPort.close()}catch(e){}serialPort=null;serialReader=null;if(!silent){localStorage.removeItem('mk_serial_v2');toast('تم فصل القارئ');updSerialUI()}}
async function readSerial(port){const dec=new TextDecoder();let buf='',t,empty=0;
 const nap=ms=>new Promise(r=>setTimeout(r,ms));
 while(serialPort===port&&port.readable){let reader=null;
  try{reader=port.readable.getReader();serialReader=reader;
   for(;;){const{value,done}=await reader.read();if(done)break;
    if(!value||!value.length){if(++empty>20){empty=0;await nap(50)}continue}empty=0;
    buf+=dec.decode(value,{stream:true});if(buf.length>4000)buf=buf.slice(-200);
    let m;while((m=buf.match(/[\r\n\t]/))){const line=buf.slice(0,m.index).replace(/[\x00-\x1F]/g,'').trim();buf=buf.slice(m.index+1);if(line)deliverScan(line,'serial')}
    clearTimeout(t);t=setTimeout(()=>{const l=buf.replace(/[\x00-\x1F]/g,'').trim();buf='';if(l)deliverScan(l,'serial')},120)}
  }catch(e){}finally{try{reader&&reader.releaseLock()}catch(e){}}
  await nap(800)/* لا نعيد المحاولة بسرعة حتى لا تتجمد الصفحة */}
 if(serialPort===port){serialPort=null;updSerialUI()}}
function updSerialUI(){$$('.serial-state').forEach(el=>el.innerHTML=serialPort?'<span class="badge ok">🟢 قارئ COM متصل</span>':'<span class="badge">⚪ غير متصل</span>')}
if(serialOK()){navigator.serial.addEventListener('connect',()=>{if(localStorage.getItem('mk_serial_v2')&&!serialPort)connectSerial(false)});
 if(localStorage.getItem('mk_serial_v2'))setTimeout(()=>connectSerial(false),300)}

/* ماسح الكاميرا: مكتبة مدمجة تعمل دون إنترنت + كاشف المتصفح إن كان مدعوماً فعلاً */
let H5LIB=null;
function loadH5(){if(H5LIB)return Promise.resolve(H5LIB);return new Promise((res,rej)=>{try{if(!window.__Html5QrcodeLibrary__){const src=$('#h5lib');if(!src)throw new Error('مكتبة الماسح غير موجودة في الملف');const s=document.createElement('script');s.textContent=src.textContent;document.head.appendChild(s)}H5LIB=window.__Html5QrcodeLibrary__;H5LIB?res(H5LIB):rej(new Error('تعذّر تحميل مكتبة الماسح'))}catch(e){rej(e)}})}
let camPref=localStorage.getItem('mk_cam')||'';
async function cameraScan(onCode,title='📷 مسح الباركود بالكاميرا'){
 let h5=null,stopped=false,busy=false;
 const stop=async()=>{stopped=true;if(h5){try{if(h5.isScanning)await h5.stop();h5.clear()}catch(e){}}};
 const w=modal(title,`<div class="row" style="margin-bottom:10px"><select id="camSel" class="grow"><option value="">جارٍ البحث عن الكاميرات…</option></select><button class="btn sm" id="camTorch" style="display:none">🔦 إضاءة</button></div>
 <div class="cam-box" style="aspect-ratio:auto;min-height:240px"><div id="camq" style="width:100%"></div></div>
 <p class="muted center small" id="camMsg" style="margin:10px 0">⏳ إذا ظهرت رسالة أعلى المتصفح اضغط <b>السماح</b>.<br>💡 إذا كان عندك قارئ باركود متصل بالكمبيوتر فلا تحتاج الكاميرا — أغلق هذه النافذة وامسح مباشرة.</p>
 <div class="row"><input id="camManual" class="grow" type="text" inputmode="numeric" placeholder="أو أدخل رقم الباركود يدوياً"><button class="btn primary" id="camOk">إدخال</button></div>`,{size:'mid',onClose:stop});
 const msg=(t,bad)=>{const m=w.querySelector('#camMsg');if(m){m.innerHTML=t;m.style.color=bad?'var(--bad)':''}};
 const done=code=>{if(stopped||busy)return;busy=true;beep();w.close();onCode(normCode(code))};
 w.querySelector('#camOk').onclick=()=>{const v=w.querySelector('#camManual').value;if(v.trim())done(v)};
 w.querySelector('#camManual').onkeydown=e=>{if(e.key==='Enter')w.querySelector('#camOk').click()};
 try{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('المتصفح لا يسمح بالكاميرا هنا — افتح الملف في Chrome أو Edge');
  const L=await loadH5();if(stopped)return;const F=L.Html5QrcodeSupportedFormats;
  const formats=[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.CODE_93,F.ITF,F.CODABAR,F.QR_CODE,F.DATA_MATRIX].filter(x=>x!==undefined);
  const sel=w.querySelector('#camSel');
  h5=new L.Html5Qrcode('camq',{formatsToSupport:formats,useBarCodeDetectorIfSupported:true,verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
  const cfg={fps:15,aspectRatio:1.333,qrbox:(vw,vh)=>({width:Math.max(200,Math.floor(vw*.85)),height:Math.max(110,Math.floor(vh*.45))})};
  const onOk=()=>{msg('✅ الكاميرا تعمل — قرّب الباركود مسافة 10–20 سم، أفقياً، في إضاءة جيدة.');
   const tb=w.querySelector('#camTorch');try{const caps=h5.getRunningTrackCapabilities();if(caps&&caps.torch){tb.style.display='';let on=false;tb.onclick=()=>{on=!on;h5.applyVideoConstraints({advanced:[{torch:on}]}).catch(()=>{})}}else tb.style.display='none'}catch(e){tb.style.display='none'}};
  const denied=e=>e&&(e.name==='NotAllowedError'||/Permission|denied/i.test(String(e)));
  /* طلب إذن الكاميرا مرة واحدة فقط */
  try{await h5.start({facingMode:'environment'},cfg,t=>done(t),()=>{})}

  if(stopped){stop();return}onOk();
  /* بعد السماح: قائمة الكاميرات بدون طلب إذن جديد */
  try{const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');let cur='';try{cur=h5.getRunningTrackSettings().deviceId||''}catch(e){}
   sel.innerHTML=devs.map((d,i)=>`<option value="${esc(d.deviceId)}">${esc(d.label||('كاميرا '+(i+1)))}</option>`).join('');if(cur)sel.value=cur;sel.disabled=devs.length<2;
   sel.onchange=async()=>{try{await h5.stop();await h5.start({deviceId:{exact:sel.value}},cfg,t=>done(t),()=>{});camPref=sel.value;localStorage.setItem('mk_cam',camPref);onOk()}catch(err){msg('⚠️ تعذّر تشغيل هذه الكاميرا: '+esc(err.message||err),true)}}}catch(e){}
 }catch(err){msg('⚠️ '+esc(err.message||err)+'<br><small>يمكنك استخدام قارئ باركود USB أو الإدخال اليدوي.</small>',true)}
}
function scannerTest(){let buf=[],last=0,rows=[];
 const w=modal('🧪 اختبار قارئ الباركود',`<p style="margin-bottom:10px">امسح أي باركود الآن <b>دون النقر على أي شيء</b>.</p>
 <div class="card" style="min-height:96px;font-size:15px" id="stOut"><span class="muted">بانتظار المسح…</span></div>

function refundSale(id){const s=byId(DB.sales,id);if(!s||s.status==='returned')return;const rq=retQtys(s),left=s.items.map((it,k)=>r2(it.qty-rq[k]));

 const f='product_name,product_name_ar,product_name_en,generic_name,brands,quantity,image_front_small_url,categories';
 const off=host=>withTimeout(`https://${host}/api/v2/product/${code}.json?fields=${f}`).then(j=>{if(!j||j.status!==1||!j.product)return null;const x=j.product;const name=(x.product_name_ar||x.product_name||x.product_name_en||x.generic_name||'').trim();if(!name)return null;
  return{name:[x.brands&&!name.toLowerCase().includes(String(x.brands).split(',')[0].toLowerCase())?String(x.brands).split(',')[0].trim():'',name,x.quantity||''].filter(Boolean).join(' '),img:x.image_front_small_url||'',category:(x.categories||'').split(',').pop().trim(),src:host.split('.')[1]}});
 const upc=withTimeout(`https://api.upcitemdb.com/prod/trial/lookup?upc=${code}`).then(j=>{const it=j&&j.items&&j.items[0];if(!it||!it.title)return null;return{name:it.title.trim(),img:(it.images||[])[0]||'',category:(it.category||'').split('>').pop().trim(),src:'upcitemdb'}});
 const all=[off('world.openfoodfacts.org'),off('world.openproductsfacts.org'),off('world.openbeautyfacts.org'),upc];
 return new Promise(res=>{let left=all.length;all.forEach(pr=>pr.then(r=>{if(r)res(r);else if(--left===0)res(null)}))})}

function normName(x){return String(x||'').replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase()}

function custBalance(id){const deb=DB.sales.filter(s=>s.customerId===id&&s.status!=='returned').map(netSale).reduce((x,s)=>x+(+(s.payments.credit)||0),0);const paid=(DB.customerPayments||[]).filter(p=>p.customerId===id).reduce((x,p)=>x+(+p.amount||0),0);return r2(deb-paid)}
/* عمر الدين: أقدم مبلغ آجل لم يُسدَّد بعد (السداد يُخصم من الأقدم أولاً) */
function custDebtAge(id){const debts=DB.sales.filter(s=>s.customerId===id&&s.status!=='returned').map(s=>({d:s.date,a:r2(+(netSale(s).payments.credit)||0)})).filter(x=>x.a>0).sort((a,b)=>String(a.d).localeCompare(String(b.d)));

 for(const x of debts){if(left+0.001>=x.a){left=r2(left-x.a);continue}since=x.d;break}

  <div class="card"><h3>💳 حسب طريقة الدفع</h3><div class="bar-list">${[['💵 نقداً',cash],['💳 بطاقة',card],['⏳ '+tr('آجل (دين)'),S.reduce((x,s)=>x+(s.payments.credit||0),0)],['💰 '+tr('تحصيل ديون العملاء'),(DB.customerPayments||[]).filter(p=>inR(p.date)).reduce((x,p)=>x+(+p.amount||0),0)]].map(([n,v])=>`<div class="bl"><span>${n}</span><b>${money(v)}</b><div class="bt"><i style="width:${gross?v/gross*100:0}%"></i></div></div>`).join('')}</div>

/* =========================================================
   USERS & PERMISSIONS — المستخدمون والصلاحيات
   ========================================================= */
function dupUsers(){const c={};DB.users.forEach(x=>{const k=String(x.username||'').toLowerCase();c[k]=(c[k]||0)+1});return new Set(Object.keys(c).filter(k=>c[k]>1))}
PAGES.users=()=>{const u=me();const DUP=dupUsers();
 $('#main').innerHTML=`<div class="card" style="margin-bottom:16px"><div class="row between" style="margin-bottom:10px"><h3 style="margin:0">👥 المستخدمون</h3><button class="btn primary" onclick="userForm()">＋ مستخدم جديد</button></div>
 ${DUP.size?`<div class="dup-warn">⚠️ يوجد <b>اسم دخول مكرر</b> (${[...DUP].map(k=>'@'+esc(k)).join('، ')}) — غالباً بسبب ربط جهاز أُنشئ عليه حساب المدير من جديد. هذا يسبب مشاكل في الدخول وكلمة المرور. احذف الحساب القديم الزائد (المعلَّم «مكرر» وليس «أنت») بزر 🗑️، أو غيّر كلمة مروره.</div>`:''}
 <div class="tbl-wrap"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور / الصلاحية</th><th>الحالة</th><th>آخر دخول</th><th></th></tr></thead><tbody>${DB.users.map(x=>`<tr><td><div class="row"><div class="avatar" style="width:30px;height:30px;font-size:13px">${esc(x.name[0])}</div><b>${esc(x.name)}</b>${x.id===u.id?' <span class="badge pri">أنت</span>':''}</div></td><td>@${esc(x.username)}${DUP.has(String(x.username||'').toLowerCase())?' <span class="badge bad">⚠️ مكرر</span>':''}${x.created?`<div class="small muted">${tr('أُنشئ')} ${fmtDate(x.created)}</div>`:''}</td>
 <td><select data-role="${x.id}" ${x.id===u.id?'disabled':''} style="width:auto">${DB.roles.map(r=>`<option value="${r.id}" ${r.id===x.role?'selected':''}>${esc(r.name)}</option>`).join('')}</select></td>
 <td>${x.active?'<span class="badge ok">مفعّل</span>':x.disabledByAdmin?'<span class="badge bad">موقوف</span>':'<span class="badge warn">بانتظار التفعيل</span>'}</td><td class="small">${x.lastLogin?fmtDate(x.lastLogin):'—'}</td>
 <td>${x.id!==u.id?`<button class="btn sm ${x.active?'':'ok'}" onclick="toggleUser('${x.id}')">${x.active?'⏸ إيقاف':'✔ تفعيل'}</button> <button class="btn sm" onclick="resetPass('${x.id}')">🔑 كلمة مرور</button> <button class="btn sm ghost" onclick="delUser('${x.id}')">🗑️</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="card"><div class="row between"><h3 style="margin:0">🔐 الأدوار والصلاحيات</h3><button class="btn" onclick="roleForm()">＋ دور جديد</button></div><p class="muted small" style="margin:8px 0 10px">فعّل أو ألغِ الصلاحيات لكل دور — تُطبّق فوراً على جميع مستخدمي الدور. دور "مدير النظام" يملك كل الصلاحيات دائماً.</p>
 <div class="tbl-wrap"><table class="perm-tbl"><thead><tr><th>الصلاحية</th>${DB.roles.map(r=>`<th>${esc(r.name)}${r.locked?'':`<br><button class="btn sm ghost" onclick="delRole('${r.id}')" title="حذف الدور">🗑️</button>`}</th>`).join('')}</tr></thead><tbody>${PERMS.map(([k,n])=>`<tr><td>${n}</td>${DB.roles.map(r=>`<td><input type="checkbox" data-r="${r.id}" data-k="${k}" ${r.perms.includes(k)?'checked':''} ${r.locked?'disabled':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
 $$('[data-role]').forEach(s=>s.onchange=()=>{const x=byId(DB.users,s.dataset.role);x.role=s.value;log('تغيير دور مستخدم',`${x.name} ← ${roleName(s.value)}`);save();toast('تم تحديث الدور','ok')});
 $$('input[data-r]').forEach(c=>c.onchange=()=>{const r=byId(DB.roles,c.dataset.r);if(c.checked)r.perms.push(c.dataset.k);else r.perms=r.perms.filter(p=>p!==c.dataset.k);log('تعديل صلاحيات',r.name);save();toast('تم الحفظ','ok')});updateBadges()};
function userForm(){const w=modal('＋ مستخدم جديد',`<form id="uf"><div class="field"><label>الاسم الكامل</label><input type="text" name="name" required autofocus></div><div class="field"><label>اسم المستخدم</label><input type="text" name="username" required></div><div class="field"><label>كلمة المرور</label><input type="password" name="password" required minlength="4"></div><div class="field"><label>الدور</label><select name="role">${DB.roles.map(r=>`<option value="${r.id}" ${r.id==='cashier'?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div><div class="modal-f"><button class="btn primary">إنشاء</button></div></form>`);
 w.querySelector('#uf').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),un=f.username.trim().toLowerCase();if(DB.users.some(u=>u.username===un))return toast('اسم المستخدم مستخدم مسبقاً','bad');
  DB.users.push({id:uid(),name:f.name.trim(),username:un,pass:await hash(f.password),role:f.role,active:true,created:nowISO()});log('إنشاء مستخدم',`${f.name} (${roleName(f.role)})`);save();w.close();toast('تم إنشاء المستخدم','ok');PAGES.users()}}
function toggleUser(id){const x=byId(DB.users,id);x.active=!x.active;x.disabledByAdmin=!x.active;log(x.active?'تفعيل مستخدم':'إيقاف مستخدم',x.name);save();PAGES.users()}
function resetPass(id){const x=byId(DB.users,id);const w=modal('🔑 تعيين كلمة مرور — '+esc(x.name),`<div class="field"><label>كلمة المرور الجديدة</label><input id="np" type="text" autofocus></div><div class="modal-f"><button class="btn primary" id="nok">حفظ</button></div>`);
 w.querySelector('#nok').onclick=async()=>{const v=w.querySelector('#np').value;if(v.length<4)return toast('4 أحرف على الأقل','bad');x.pass=await hash(v);log('إعادة تعيين كلمة مرور',x.name);save();w.close();toast('تم التغيير','ok')}}
function delUser(id){const x=byId(DB.users,id);if(x.role==='admin'&&DB.users.filter(u=>u.role==='admin'&&u.active).length<=1)return toast('لا يمكن حذف آخر مدير','bad');confirmBox(`حذف المستخدم ${esc(x.name)}؟`,()=>{DB.users=DB.users.filter(u=>u.id!==id);log('حذف مستخدم',x.name);save();PAGES.users()})}
function roleForm(){const w=modal('＋ دور جديد',`<div class="field"><label>اسم الدور</label><input id="rn" type="text" placeholder="مثال: مندوب مشتريات" autofocus></div><div class="field"><label>نسخ الصلاحيات من</label><select id="rc"><option value="">بدون</option>${DB.roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="modal-f"><button class="btn primary" id="rok">إنشاء</button></div>`);
 w.querySelector('#rok').onclick=()=>{const n=w.querySelector('#rn').value.trim();if(!n)return;const src=byId(DB.roles,w.querySelector('#rc').value);DB.roles.push({id:uid(),name:n,perms:src?[...src.perms]:[]});log('إنشاء دور',n);save();w.close();PAGES.users()}}
function delRole(id){const r=byId(DB.roles,id);if(DB.users.some(u=>u.role===id))return toast('الدور مستخدم من قبل حسابات — غيّرها أولاً','warn');confirmBox(`حذف الدور ${esc(r.name)}؟`,()=>{DB.roles=DB.roles.filter(x=>x.id!==id);save();PAGES.users()})}

/* =========================================================
   SETTINGS — الإعدادات والنسخ الاحتياطي
   ========================================================= */
function currencySettings(){const S=DB.settings;
 const opts=(sel,withNone)=>(withNone?`<option value="">— بدون عملة ثانية —</option>`:'')+allCurrencies().map(c=>`<option value="${c.code}" ${c.code===sel?'selected':''}>${esc(c.name)} — ${esc(c.sym)} (${c.code})</option>`).join('');
 const w=modal('💱 العملات',`<div class="field"><label>العملة الأساسية للمتجر (الأسعار والفواتير والتقارير)</label><select id="cMain">${opts(S.currencyCode)}</select></div>
 <div class="grid g2"><div class="field"><label>الرمز الظاهر</label><input type="text" id="cSym" value="${esc(S.currency)}"></div><div class="field"><label>عدد الخانات العشرية</label><select id="cDec"><option value="0">0 — بدون كسور (مثل 15,000)</option><option value="2">2 — مثل 15.50</option><option value="3">3 — مثل 1.250</option></select></div></div>
 <div class="alert info" style="font-weight:500">⚠️ تغيير العملة الأساسية لا يحوّل الأسعار المسجلة تلقائياً — بعد التغيير عدّل أسعار المنتجات بالعملة الجديدة.</div>
 <div class="card" style="margin-bottom:12px"><h3 style="margin-bottom:8px">🔁 عملة ثانية (اختياري)</h3><p class="muted small" style="margin-bottom:10px">تُعرض قيمة الفاتورة بها أيضاً في نقطة البيع والإيصال — مفيدة للسياح أو الدفع بعملة أخرى.</p>
  <div class="field"><label>العملة الثانية</label><select id="c2">${opts(S.currency2,true)}</select></div>
  <div class="field" id="rateF"><label id="rateL"></label><input type="text" inputmode="decimal" id="cRate" value="${S.rate2||''}" placeholder="سعر الصرف"></div><div class="small" id="cPrev"></div></div>
 <div class="row between"><button type="button" class="btn" id="cAdd">＋ إضافة عملة غير موجودة</button><button class="btn primary lg" id="cSave">💾 حفظ</button></div>`,{size:'mid'});
 const mainEl=w.querySelector('#cMain'),symEl=w.querySelector('#cSym'),decEl=w.querySelector('#cDec'),c2El=w.querySelector('#c2'),rEl=w.querySelector('#cRate');
 decEl.value=String(curDec());
 const upd=()=>{const m=curByCode(mainEl.value),c=curByCode(c2El.value);w.querySelector('#rateF').style.display=c?'':'none';
  w.querySelector('#rateL').textContent=c?`سعر الصرف: 1 ${m?m.sym:symEl.value} = ؟ ${c.sym}`:'';
  w.querySelector('#cPrev').innerHTML=c&&num(rEl.value)>0?(()=>{const ex=+decEl.value===0?100000:100;return`مثال: فاتورة بقيمة <b>${fmtC(ex,+decEl.value)} ${esc(symEl.value)}</b> = <b>${fmtC(ex*num(rEl.value),c.dec)} ${esc(c.sym)}</b>`})():''};
 mainEl.onchange=()=>{const m=curByCode(mainEl.value);if(m){symEl.value=m.sym;decEl.value=String(m.dec)}if(c2El.value===mainEl.value)c2El.value='';upd()};
 c2El.onchange=upd;rEl.oninput=upd;decEl.onchange=upd;symEl.oninput=upd;upd();
 w.querySelector('#cAdd').onclick=()=>{const a=modal('＋ عملة جديدة',`<div class="grid g2"><div class="field"><label>اسم العملة *</label><input type="text" id="nN" placeholder="مثال: دونغ فيتنامي" autofocus></div><div class="field"><label>الرمز الدولي (3 أحرف) *</label><input type="text" id="nC" maxlength="3" placeholder="VND" style="text-transform:uppercase"></div>
  <div class="field"><label>الرمز الظاهر *</label><input type="text" id="nS" placeholder="₫"></div><div class="field"><label>الخانات العشرية</label><select id="nD"><option value="0">0</option><option value="2" selected>2</option><option value="3">3</option></select></div></div><div class="modal-f"><button class="btn primary" id="nOk">إضافة</button></div>`);
  a.querySelector('#nOk').onclick=()=>{const name=a.querySelector('#nN').value.trim(),code=a.querySelector('#nC').value.trim().toUpperCase(),sym=a.querySelector('#nS').value.trim(),dec=+a.querySelector('#nD').value;
   if(!name||!/^[A-Z]{3}$/.test(code)||!sym)return toast('أكمل الاسم والرمز الدولي (3 أحرف إنجليزية) والرمز الظاهر','bad');if(curByCode(code))return toast('هذه العملة موجودة مسبقاً','warn');
   S.customCurrencies=S.customCurrencies||[];S.customCurrencies.push({code,name,sym,dec,custom:true});save();log('إضافة عملة',name);a.close();
   const add=(el)=>{const o=document.createElement('option');o.value=code;o.textContent=`${name} — ${sym} (${code})`;el.appendChild(o)};add(mainEl);add(c2El);toast('تمت إضافة '+name,'ok')}};
 w.querySelector('#cSave').onclick=()=>{const m=curByCode(mainEl.value);const changed=m&&m.code!==S.currencyCode;
  S.currencyCode=mainEl.value;S.currency=symEl.value.trim()||(m?m.sym:'');S.decimals=+decEl.value;S.currency2=c2El.value;S.rate2=num(rEl.value);
  if(S.currency2&&!(S.rate2>0))return toast('أدخل سعر الصرف للعملة الثانية','bad');
  log('تعديل العملات',`${S.currencyCode}${S.currency2?' + '+S.currency2+' @'+S.rate2:''}`);save();w.close();toast(changed?'تم تغيير العملة — راجع أسعار المنتجات':'تم حفظ إعدادات العملات','ok');renderApp()}}
PAGES.settings=()=>{const S=DB.settings;
 $('#main').innerHTML=`<div class="grid g2"><div class="card"><h3>🏪 بيانات المتجر</h3><form id="stf">
 ${(()=>{const adm=me()&&me().role==='admin',t=(S.nameTr||{})[S.storeName]||{};return`<div class="field"><label>اسم المتجر ${adm?'':'<span class="badge">🔒 '+tr('للمدير فقط')+'</span>'}</label><input type="text" name="storeName" value="${esc(S.storeName)}" ${adm?'':'disabled'}></div>

 <div class="field"><label>العنوان</label><input type="text" name="address" value="${esc(S.address)}"></div><div class="grid g3"><div class="field"><label>نسبة الضريبة %</label><input type="text" name="vat" value="${S.vat}"></div><div class="field"><label>العملة</label><button type="button" class="btn" style="width:100%;justify-content:space-between" onclick="currencySettings()"><span>💱 ${esc((curByCode(S.currencyCode)||{}).name||S.currency)} (${esc(S.currency)})</span><span class="muted small">تغيير</span></button></div><div class="field"><label>حد التنبيه الافتراضي</label><input type="text" name="lowDefault" value="${S.lowDefault}"></div></div>

 <div class="field"><label>🔠 حجم خط الطباعة</label><select name="printScale">${[['0.9','صغير'],['1','عادي'],['1.2','كبير'],['1.4','كبير جداً'],['1.7','ضخم']].map(([v,n])=>`<option value="${v}" ${String(S.printScale||1)===v?'selected':''}>${n}</option>`).join('')}</select></div></div>
 <div style="margin:-4px 0 12px"><button type="button" class="btn sm" id="prTest">🖨️ طباعة تجريبية</button> <span class="muted small">جرّب المقاس والخط قبل الحفظ</span></div>

/* =========================================================
   المزامنة السحابية (Supabase) — يعمل محلياً أولاً ثم يزامن
   - البيانات تُحفظ دائماً على الجهاز، وتُرفع/تُنزّل عند توفر الإنترنت
   - المخزون يُحسب من حركات المخزون (لا يُنسخ رقم الكمية بين الأجهزة)
   ========================================================= */
const SYNC_KEY='mk_sync_cfg',SHADOW_KEY='mk_sync_shadow';

const syncSave=()=>{try{if(SYNC.on&&!SYNC.schema&&typeof SYNC_SCHEMA!=='undefined')SYNC.schema=SYNC_SCHEMA;localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC));localStorage.setItem(SHADOW_KEY,JSON.stringify(SHADOW))}catch(e){}};
const SYNC_COLLS=['users','roles','products','suppliers','supplierPayments','customers','customerPayments','sales','purchases','movements','expenses','logs'];
/* عند إضافة أنواع بيانات جديدة للمزامنة: أعد التنزيل الكامل مرة واحدة حتى تصل السجلات التي تجاهلتها النسخة الأقدم */
const SYNC_SCHEMA='v2:'+SYNC_COLLS.join(',');
if(SYNC.on&&SYNC.schema!==SYNC_SCHEMA){SYNC.cursor=null;SYNC.schema=SYNC_SCHEMA;try{localStorage.setItem(SYNC_KEY,JSON.stringify(SYNC))}catch(e){}}
const SORT_BY_DATE=['sales','purchases','movements','expenses','logs','supplierPayments'];
let syncBusy=false,syncTimer=null,syncState='off',syncPendingN=0;
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+s.length.toString(36)}
function recHash(c,r){if(c==='products'){const{qty,...rest}=r;return fnv(JSON.stringify(rest))}return fnv(JSON.stringify(r))}
function localRecords(){const o={};for(const c of SYNC_COLLS)o[c]=DB[c]||(DB[c]=[]);o.settings=[{id:'main',...DB.settings}];o.lists=[{id:'main',categories:DB.categories||[],expenseCats:DB.expenseCats||null}];return o}
const docNo=(prefix,n,pad=0)=>{const x=pad?String(n).padStart(pad,'0'):String(n);return SYNC.on&&SYNC.tag?`${prefix}-${SYNC.tag}${x}`:`${prefix}-${x}`};
const randTag=()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]+'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)];

/* ---- المخزون = رصيد أساسي + مجموع الحركات ---- */
function movSums(){const m={};for(const x of DB.movements)m[x.pid]=(m[x.pid]||0)+(+x.qty||0);return m}
function ensureQty0(){const m=movSums(),a=dropSums();let n=0;for(const p of DB.products)if(typeof p.qty0!=='number'){p.qty0=r2((+p.qty||0)-(a[p.id]||0)-(m[p.id]||0));n++}return n}
/* حركات حُذفت من هذا الجهاز فقط وما زالت في السحابة — يبقى أثرها في الكمية حتى تُحذف من السحابة */
function dropSums(){const m={};const d=DB.dropMov||{};for(const k in d){m[d[k].p]=(m[d[k].p]||0)+(+d[k].q||0)}return m}
function recalcQty(){const m=movSums(),a=dropSums();for(const p of DB.products){if(typeof p.qty0!=='number')p.qty0=r2((+p.qty||0)-(a[p.id]||0)-(m[p.id]||0));p.qty=r2(p.qty0+(a[p.id]||0)+(m[p.id]||0))}}

/* ---- فحص ساعة الجهاز مقابل ساعة الخادم ---- */

/* ---- الاتصال بـ Supabase عبر REST (بدون مكتبات خارجية) ---- */
function fetchT(url,opt={},ms=20000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opt,signal:c.signal}).finally(()=>clearTimeout(t))}
function setTokens(j){SYNC.access=j.access_token;SYNC.refresh=j.refresh_token;SYNC.exp=Date.now()+((+j.expires_in||3600)*1000);if(j.user&&j.user.id)SYNC.uid=j.user.id;SYNC.needLogin=false}
async function authPost(grant,body){const r=await fetchT(SYNC.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SYNC.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 let j={};try{j=await r.json()}catch(e){}if(!r.ok){const e=new Error(j.error_description||j.msg||j.message||j.error||('HTTP '+r.status));e.status=r.status;throw e}return j}
async function ensureToken(){if(SYNC.access&&Date.now()<(SYNC.exp||0)-60000)return;if(!SYNC.refresh){SYNC.needLogin=true;throw new Error('يلزم تسجيل الدخول للسحابة')}

async function api(method,path,body,extra={},retry=true){await ensureToken();
 const r=await fetchT(SYNC.url+path,{method,headers:{apikey:SYNC.key,Authorization:'Bearer '+SYNC.access,'Content-Type':'application/json',...extra},body:body?JSON.stringify(body):undefined});
 if(r.status===401&&retry){SYNC.exp=0;return api(method,path,body,extra,false)}
 const t=await r.text();if(!r.ok){let m=t;try{const j=JSON.parse(t);m=j.message||j.msg||t;if(/mk_records/.test(m)&&/(does not exist|not find|schema cache)/i.test(m))m='جدول mk_records غير موجود — شغّل ملف supabase_setup.sql في SQL Editor'}catch(e){}throw new Error(String(m).slice(0,220)||('HTTP '+r.status))}
 return t?JSON.parse(t):null}

/* ---- الرفع: كل سجل تغيّر منذ آخر مزامنة ---- */
function pendingChanges(){const L=localRecords(),ch=[];for(const c in L){const sh=SHADOW[c]||{},seen=new Set();
  for(const r of L[c]){if(!r||r.id==null)continue;const id=String(r.id);seen.add(id);const h=recHash(c,r);if(sh[id]!==h)ch.push({coll:c,id,data:r,deleted:false,h})}
  for(const id in sh)if(!seen.has(id)&&sh[id]!=='x'&&!String(sh[id]).startsWith('~'))ch.push({coll:c,id,data:{},deleted:true,h:'x'})}
 return ch}
async function pushChanges(){const ch=pendingChanges();syncPendingN=ch.length;if(!ch.length)return 0;
 const order=['settings','lists','roles','users','suppliers','customers','products','movements','sales','purchases','supplierPayments','customerPayments','expenses','logs'];ch.sort((a,b)=>order.indexOf(a.coll)-order.indexOf(b.coll));
 for(let i=0;i<ch.length;i+=400){const b=ch.slice(i,i+400);
  if(!window.__skewProbe&&b[0])window.__skewProbe={coll:b[0].coll,id:b[0].id,t:Date.now()};
  if(SYNC.mode==='user')await mkRpc('mk_push',{p_token:SYNC.token,p_rows:b.map(x=>({coll:x.coll,id:x.id,data:x.data,deleted:x.deleted}))});
  else await api('POST','/rest/v1/mk_records?on_conflict=store_id,coll,id',b.map(x=>({store_id:SYNC.uid,coll:x.coll,id:x.id,data:x.data,deleted:x.deleted})),{Prefer:'resolution=merge-duplicates,return=minimal'});
  b.forEach(x=>{(SHADOW[x.coll]=SHADOW[x.coll]||{})[x.id]=x.h});syncPendingN=Math.max(0,syncPendingN-b.length);syncSave()}

/* ---- التنزيل: السجلات التي تغيّرت على السحابة ---- */
function applyRemote(rows){let changed=0,qtyDirty=false;const touched=new Set();
 for(const row of rows){const c=row.coll,id=String(row.id);if(!(SYNC_COLLS.includes(c)||c==='settings'||c==='lists'))continue;const sh=(SHADOW[c]=SHADOW[c]||{});
  const single=c==='settings'||c==='lists';const L=single?localRecords()[c][0]:null;const arr=single?null:DB[c];const idx=single?-1:arr.findIndex(x=>String(x.id)===id);const loc=single?L:(idx>=0?arr[idx]:null);
  const locH=loc?recHash(c,loc):'x';
  if(String(sh[id]).startsWith('~')){const cut=sh[id].slice(1);if(!cut||new Date(row.updated_at)<=new Date(cut))continue}
  else if(sh[id]!==undefined&&locH!==sh[id])continue;            /* تعديل محلي لم يُرفع بعد — يُرفع ويفوز */
  if(row.deleted){if(!single&&idx>=0){arr.splice(idx,1);changed++;touched.add(c)}if(c==='movements'&&DB.dropMov&&DB.dropMov[id]){delete DB.dropMov[id];changed++;touched.add(c)}sh[id]='x';continue}
  const data=row.data||{};const rh=recHash(c,data);
  if(loc&&locH===rh){sh[id]=rh;continue}                    /* نفس النسخة — لا تغيير */
  if(c==='settings'){const d={...data};delete d.id;DB.settings=Object.assign(freshDB().settings,d)}
  else if(c==='lists'){if(Array.isArray(data.categories))DB.categories=data.categories;if(Array.isArray(data.expenseCats))DB.expenseCats=data.expenseCats}
  else if(idx>=0)arr[idx]=data;else arr.push(data);
  sh[id]=single?recHash(c,localRecords()[c][0]):rh;changed++;touched.add(c)}
 if(touched.has('products')||touched.has('movements'))recalcQty();
 for(const c of SORT_BY_DATE)if(touched.has(c))DB[c].sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 if(changed){try{localStorage.setItem(LS_KEY,JSON.stringify(DB))}catch(e){}}
 return changed}
async function pullChanges(){const since=SYNC.cursor?new Date(new Date(SYNC.cursor).getTime()-30000).toISOString():'1970-01-01T00:00:00Z';let off=0,max=SYNC.cursor||null;const all=[];
 for(;;){const rows=(SYNC.mode==='user'?await mkRpc('mk_pull',{p_token:SYNC.token,p_since:since,p_limit:1000,p_offset:off}):await api('GET',`/rest/v1/mk_records?select=coll,id,data,deleted,updated_at&updated_at=gte.${encodeURIComponent(since)}&order=updated_at.asc,coll.asc,id.asc&limit=1000&offset=${off}`))||[];
  all.push(...rows);for(const r of rows)if(!max||new Date(r.updated_at)>new Date(max))max=r.updated_at;
  {const P=window.__skewProbe;if(P){const hit=rows.find(r=>r.coll===P.coll&&String(r.id)===String(P.id));if(hit){window.__skewProbe=null;setSkew(Date.parse(hit.updated_at)-P.t)}else if(Date.now()-P.t>300000)window.__skewProbe=null}}if(rows.length<1000)break;off+=1000}
 const n=applyRemote(all);SYNC.cursor=max;syncSave();return n}

/* ---- حلقة المزامنة ---- */

  SYNC.lastOk=Date.now();SYNC.lastErr='';syncPendingN=pendingChanges().length;setSyncState(syncPendingN?'busy':'ok')}
 catch(e){SYNC.lastErr=String(e&&e.name==='AbortError'?'انتهت مهلة الاتصال':(e&&e.message)||e);try{syncPendingN=pendingChanges().length}catch(x){}setSyncState(SYNC.needLogin?'login':(navigator.onLine&&!/Failed to fetch|NetworkError|انتهت مهلة/.test(SYNC.lastErr)?'err':'offline'))}

function scheduleSync(ms=1500){if(!SYNC.on)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),ms)}
setInterval(()=>{if(SYNC.on)syncNow()},12000);

 const a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='scan';
 if(current==='pos'&&$('#pgrid')){renderGrid();renderTotals();return}
 if(!$('.modal-bg')&&!typing&&$('#main'))PAGES[current]()}

async function syncConnect(url,key,email,pw,tag,mode){
 url=String(url).trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'');if(!/^https?:\/\//.test(url))throw new Error('أدخل Project URL صحيح يبدأ بـ https://');

 const prev=SYNC;SYNC=next;
 let remoteHas=false;try{setTokens(await authPost('password',{email,password:pw}));remoteHas=((await api('GET','/rest/v1/mk_records?select=id&limit=1'))||[]).length>0}
 catch(e){SYNC=prev;if(/Invalid login credentials/i.test(e.message))e.message='البريد أو كلمة المرور غير صحيحة (حساب Supabase) — اضغط 👁 لرؤية ما كتبته. المطلوب كلمة مرور المستخدم في Authentication ← Users، وليست كلمة دخول موقع supabase.com ولا كلمة مرور البرنامج.';if(/Email not confirmed/i.test(e.message))e.message='البريد غير مؤكد — فعّل Auto Confirm أو أكّد الحساب من Supabase';throw e}

 if(mode==='merge'&&remoteHas){try{const ru=((await api('GET','/rest/v1/mk_records?select=coll,id,data,deleted&coll=eq.users'))||[]).filter(r=>r.coll==='users'&&!r.deleted&&r.data);
  const byName=new Map(ru.map(r=>[String(r.data.username||'').toLowerCase(),String(r.id)]));
  adopted=DB.users.filter(u=>{const c=byName.get(String(u.username||'').toLowerCase());return c&&c!==String(u.id)});
  if(adopted.length){const ids=new Set(adopted.map(u=>u.id));DB.users=DB.users.filter(u=>!ids.has(u.id));if(ids.has(SESSION)){SESSION=null;localStorage.removeItem(SS_KEY);sessionStorage.removeItem(SS_KEY)}}}catch(e){}}
 if(mode==='cloud'){DB=freshDB();SESSION=null;localStorage.removeItem(SS_KEY);sessionStorage.removeItem(SS_KEY)}
 SHADOW={};SYNC.on=true;syncSave();ensureQty0();
 await syncNow(true);if(SYNC.lastErr)throw new Error(SYNC.lastErr);save();if(adopted.length)setTimeout(()=>toast(tr('الحساب موجود في السحابة — سجّل الدخول بكلمة مروره المعتادة: ')+adopted.map(u=>'@'+u.username).join(', '),'warn'),900);if(dupUsers().size)setTimeout(()=>toast('⚠️ يوجد اسم دخول مكرر بعد الدمج — راجع صفحة المستخدمين واحذف الحساب الزائد','warn'),900)}
const SUPABASE_SQL="-- =====================================================================\n--  نظام المخازن والمشتريات — إعداد قاعدة بيانات Supabase\n--  Warehouse & Purchasing System — Supabase setup\n--\n--  طريقة الاستخدام:\n--  1) افتح مشروعك في Supabase ← SQL Editor ← New query\n--  2) الصق هذا الملف كاملاً واضغط Run (مرة واحدة فقط)\n--  3) Authentication ← Users ← Add user ← أنشئ حساب المتجر\n--     (بريد + كلمة مرور) وفعّل خيار Auto Confirm User\n--  كل الأجهزة تسجّل الدخول للسحابة بنفس حساب المتجر.\n-- =====================================================================\n\ncreate table if not exists public.mk_records (\n  store_id   uuid        not null default auth.uid() references auth.users (id) on delete cascade,\n  coll       text        not null,              -- اسم المجموعة: products, sales, movements ...\n  id         text        not null,              -- معرّف السجل داخل البرنامج\n  data       jsonb       not null default '{}'::jsonb,\n  deleted    boolean     not null default false, -- حذف منطقي حتى يصل الحذف لكل الأجهزة\n  updated_at timestamptz not null default now(),\n  primary key (store_id, coll, id)\n);\n\ncreate index if not exists mk_records_sync_idx on public.mk_records (store_id, updated_at);\n\n-- وقت التعديل يُحدَّد من الخادم دائماً (لا يعتمد على ساعة الجهاز)\ncreate or replace function public.mk_records_touch()\nreturns trigger\nlanguage plpgsql\nas $$\nbegin\n  new.updated_at := clock_timestamp();\n  return new;\nend;\n$$;\n\ndrop trigger if exists mk_records_touch on public.mk_records;\ncreate trigger mk_records_touch\n  before insert or update on public.mk_records\n  for each row execute function public.mk_records_touch();\n\n-- الأمان: كل حساب متجر يرى ويعدّل بياناته فقط\nalter table public.mk_records enable row level security;\n\ndrop policy if exists \"mk_records_owner\" on public.mk_records;\ncreate policy \"mk_records_owner\" on public.mk_records\n  for all\n  to authenticated\n  using (store_id = auth.uid())\n  with check (store_id = auth.uid());\n\ngrant select, insert, update on public.mk_records to authenticated;\n\n-- =====================================================================\n--  النسخ الاحتياطية السحابية — نظام المخازن\n--  شغّل هذا الكود مرة واحدة في Supabase ← SQL Editor ← Run\n--  • كل نسخة مضغوطة (gzip) ومشفّرة (AES-256) بكلمة سر النسخ الاحتياطي\n--    — Supabase نفسه لا يستطيع قراءة محتواها.\n--  • البرنامج يستطيع الإضافة والقراءة فقط — لا يستطيع تعديل أو حذف أي نسخة،\n--    فحتى \"مسح البيانات من كل مكان\" لا يلمس النسخ الاحتياطية.\n--  • يُحتفظ بآخر 30 نسخة تلقائية، والنسخ اليدوية تبقى حتى تحذفها أنت\n--    من Table Editor.\n-- =====================================================================\n\ncreate table if not exists public.mk_backups (\n  id         bigint generated always as identity primary key,\n  store_id   uuid        not null default auth.uid() references auth.users (id) on delete cascade,\n  created_at timestamptz not null default now(),\n  device     text,\n  kind       text        not null default 'manual',   -- manual | auto | before-restore\n  note       text,\n  size       integer,\n  counts     jsonb       not null default '{}'::jsonb,\n  payload    text        not null                      -- مضغوط + مشفّر\n);\n\ncreate index if not exists mk_backups_store_idx on public.mk_backups (store_id, created_at desc);\n\nalter table public.mk_backups enable row level security;\n\ndrop policy if exists \"mk_backups_owner\" on public.mk_backups;\ncreate policy \"mk_backups_owner\" on public.mk_backups\n  for all\n  to authenticated\n  using (store_id = auth.uid())\n  with check (store_id = auth.uid());\n\n-- إضافة وقراءة فقط (بدون update/delete) — حماية من الحذف بالغلط\nrevoke update, delete on public.mk_backups from authenticated, anon;\ngrant select, insert on public.mk_backups to authenticated;\n\n-- تنظيف تلقائي: إبقاء آخر 30 نسخة تلقائية لكل متجر\ncreate or replace function public.mk_backups_prune()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\nbegin\n  new.created_at := clock_timestamp();\n  if new.kind = 'auto' then\n    delete from public.mk_backups\n     where store_id = new.store_id and kind = 'auto'\n       and id not in (select id from public.mk_backups\n                       where store_id = new.store_id and kind = 'auto'\n                       order by created_at desc limit 29);\n  end if;\n  return new;\nend;\n$$;\n\ndrop trigger if exists mk_backups_prune on public.mk_backups;\ncreate trigger mk_backups_prune\n  before insert on public.mk_backups\n  for each row execute function public.mk_backups_prune();\n\n-- =====================================================================\n--  نظام المخازن — الدخول من أي متصفح باسم مستخدم البرنامج وكلمة مروره\n--  شغّل هذا الكود مرة واحدة في Supabase ← SQL Editor ← Run\n--  (بعد supabase_setup.sql)\n--\n--  • أي متصفح جديد: يكفي اسم المستخدم وكلمة المرور الخاصة بالبرنامج —\n--    لا حاجة لإدخال بيانات Supabase أو كلمة مرور حساب المتجر.\n--  • المستخدم الموقوف أو غير المفعّل لا يستطيع الدخول، وتُلغى جلساته فوراً.\n--  • طلبات إنشاء الحسابات الجديدة تبقى «بانتظار موافقة المدير».\n--  • محاولات الدخول الخاطئة المتكررة تُحظر مؤقتاً (8 محاولات / 15 دقيقة).\n-- =====================================================================\n\ncreate table if not exists public.mk_sessions (\n  token      text        primary key,\n  store_id   uuid        not null references auth.users (id) on delete cascade,\n  user_id    text        not null,\n  device     text,\n  created_at timestamptz not null default now(),\n  last_seen  timestamptz not null default now(),\n  expires_at timestamptz not null default now() + interval '60 days'\n);\n\ncreate table if not exists public.mk_login_attempts (\n  id       bigint generated always as identity primary key,\n  username text,\n  ok       boolean not null,\n  at       timestamptz not null default now()\n);\ncreate index if not exists mk_login_attempts_idx on public.mk_login_attempts (username, at);\n\n-- لا وصول مباشر لهذه الجداول — فقط عبر الدوال أدناه\nalter table public.mk_sessions enable row level security;\nalter table public.mk_login_attempts enable row level security;\nrevoke all on public.mk_sessions, public.mk_login_attempts from anon, authenticated;\n\n-- ---------------------------------------------------------------------\n-- (داخلية) التحقق من الجلسة: صالحة + المستخدم ما زال مفعّلاً\ncreate or replace function public.mk__session(p_token text)\nreturns public.mk_sessions\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  s public.mk_sessions;\n  u jsonb;\nbegin\n  select * into s from public.mk_sessions where token = p_token and expires_at > now();\n  if not found then\n    raise exception 'MK_SESSION_INVALID';\n  end if;\n  select data into u from public.mk_records\n   where store_id = s.store_id and coll = 'users' and id = s.user_id and not deleted;\n  if u is null or coalesce((u->>'active')::boolean, false) = false then\n    delete from public.mk_sessions where token = p_token;\n    raise exception 'MK_SESSION_INVALID';\n  end if;\n  if s.last_seen < now() - interval '10 minutes' then\n    update public.mk_sessions set last_seen = now() where token = p_token;\n  end if;\n  return s;\nend;\n$$;\nrevoke execute on function public.mk__session(text) from public, anon, authenticated;\n\n-- ---------------------------------------------------------------------\n-- تسجيل الدخول: يعيد رمز جلسة\ncreate or replace function public.mk_login(p_username text, p_pass text, p_device text default null, p_store uuid default null)\nreturns json\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  uname text := lower(trim(coalesce(p_username, '')));\n  fails int;\n  r record;\n  tok text;\nbegin\n  if uname = '' or coalesce(p_pass, '') = '' then\n    return json_build_object('error', 'bad_login');\n  end if;\n  select count(*) into fails from public.mk_login_attempts\n   where username = uname a
