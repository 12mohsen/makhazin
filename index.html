nt\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  s public.mk_sessions := public.mk__session(p_token);\n  me jsonb;\n  is_admin boolean;\n  row jsonb;\n  cur jsonb;\n  n int := 0;\nbegin\n  select data into me from public.mk_records where store_id = s.store_id and coll = 'users' and id = s.user_id;\n  is_admin := coalesce(me->>'role', '') = 'admin';\n\n  for row in select * from jsonb_array_elements(coalesce(p_rows, '[]'::jsonb)) loop\n    if coalesce(row->>'coll', '') = '' or coalesce(row->>'id', '') = '' then\n      continue;\n    end if;\n    if not is_admin then\n      if row->>'coll' = 'roles' then\n        continue;\n      end if;\n      if row->>'coll' = 'users' then\n        if row->>'id' <> s.user_id or coalesce((row->>'deleted')::boolean, false) then\n          continue;\n        end if;\n        select data into cur from public.mk_records where store_id = s.store_id and coll = 'users' and id = s.user_id;\n        if coalesce(row->'data'->>'role', '') <> coalesce(cur->>'role', '')\n           or coalesce((row->'data'->>'active')::boolean, false) <> coalesce((cur->>'active')::boolean, false) then\n          continue;\n        end if;\n      end if;\n    end if;\n\n    insert into public.mk_records (store_id, coll, id, data, deleted)\n    values (s.store_id, row->>'coll', row->>'id', coalesce(row->'data', '{}'::jsonb), coalesce((row->>'deleted')::boolean, false))\n    on conflict (store_id, coll, id) do update\n      set data = excluded.data, deleted = excluded.deleted;\n    n := n + 1;\n  end loop;\n  return n;\nend;\n$$;\n\n-- ---------------------------------------------------------------------\ncreate or replace function public.mk_logout(p_token text)\nreturns void\nlanguage sql\nsecurity definer\nset search_path = public\nas $$\n  delete from public.mk_sessions where token = p_token;\n$$;\n\n-- ---------------------------------------------------------------------\n-- النسخ الاحتياطية عبر الجلسة (تتطلب جدول mk_backups من supabase_backups.sql)\ncreate or replace function public.mk_backup_add(p_token text, p_device text, p_kind text, p_note text, p_size int, p_counts jsonb, p_payload text)\nreturns void\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  s public.mk_sessions := public.mk__session(p_token);\nbegin\n  insert into public.mk_backups (store_id, device, kind, note, size, counts, payload)\n  values (s.store_id, left(p_device, 40), coalesce(p_kind, 'manual'), left(p_note, 200), p_size, coalesce(p_counts, '{}'::jsonb), p_payload);\nend;\n$$;\n\ncreate or replace function public.mk_backup_list(p_token text)\nreturns table (id bigint, created_at timestamptz, device text, kind text, note text, size int, counts jsonb)\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  s public.mk_sessions := public.mk__session(p_token);\nbegin\n  return query\n    select b.id, b.created_at, b.device, b.kind, b.note, b.size, b.counts\n      from public.mk_backups b where b.store_id = s.store_id\n     order by b.created_at desc limit 200;\nend;\n$$;\n\ncreate or replace function public.mk_backup_get(p_token text, p_id bigint)\nreturns text\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\ndeclare\n  s public.mk_sessions := public.mk__session(p_token);\n  p text;\nbegin\n  select payload into p from public.mk_backups where store_id = s.store_id and id = p_id;\n  return p;\nend;\n$$;\n\ngrant execute on function public.mk_login(text, text, text, uuid) to anon, authenticated;\ngrant execute on function public.mk_register(text, text, text, uuid) to anon, authenticated;\ngrant execute on function public.mk_pull(text, timestamptz, int, int) to anon, authenticated;\ngrant execute on function public.mk_push(text, jsonb) to anon, authenticated;\ngrant execute on function public.mk_logout(text) to anon, authenticated;\ngrant execute on function public.mk_backup_add(text, text, text, text, int, jsonb, text) to anon, authenticated;\ngrant execute on function public.mk_backup_list(text) to anon, authenticated;\ngrant execute on function public.mk_backup_get(text, bigint) to anon, authenticated;\n\n-- تحديث مخطط الواجهة البرمجية فوراً\nnotify pgrst, 'reload schema';\n";
const BACKUP_SQL="-- =====================================================================\n--  النسخ الاحتياطية السحابية — نظام المخازن\n--  شغّل هذا الكود مرة واحدة في Supabase ← SQL Editor ← Run\n--  • كل نسخة مضغوطة (gzip) ومشفّرة (AES-256) بكلمة سر النسخ الاحتياطي\n--    — Supabase نفسه لا يستطيع قراءة محتواها.\n--  • البرنامج يستطيع الإضافة والقراءة فقط — لا يستطيع تعديل أو حذف أي نسخة،\n--    فحتى \"مسح البيانات من كل مكان\" لا يلمس النسخ الاحتياطية.\n--  • يُحتفظ بآخر 30 نسخة تلقائية، والنسخ اليدوية تبقى حتى تحذفها أنت\n--    من Table Editor.\n-- =====================================================================\n\ncreate table if not exists public.mk_backups (\n  id         bigint generated always as identity primary key,\n  store_id   uuid        not null default auth.uid() references auth.users (id) on delete cascade,\n  created_at timestamptz not null default now(),\n  device     text,\n  kind       text        not null default 'manual',   -- manual | auto | before-restore\n  note       text,\n  size       integer,\n  counts     jsonb       not null default '{}'::jsonb,\n  payload    text        not null                      -- مضغوط + مشفّر\n);\n\ncreate index if not exists mk_backups_store_idx on public.mk_backups (store_id, created_at desc);\n\nalter table public.mk_backups enable row level security;\n\ndrop policy if exists \"mk_backups_owner\" on public.mk_backups;\ncreate policy \"mk_backups_owner\" on public.mk_backups\n  for all\n  to authenticated\n  using (store_id = auth.uid())\n  with check (store_id = auth.uid());\n\n-- إضافة وقراءة فقط (بدون update/delete) — حماية من الحذف بالغلط\nrevoke update, delete on public.mk_backups from authenticated, anon;\ngrant select, insert on public.mk_backups to authenticated;\n\n-- تنظيف تلقائي: إبقاء آخر 30 نسخة تلقائية لكل متجر\ncreate or replace function public.mk_backups_prune()\nreturns trigger\nlanguage plpgsql\nsecurity definer\nset search_path = public\nas $$\nbegin\n  new.created_at := clock_timestamp();\n  if new.kind = 'auto' then\n    delete from public.mk_backups\n     where store_id = new.store_id and kind = 'auto'\n       and id not in (select id from public.mk_backups\n                       where store_id = new.store_id and kind = 'auto'\n                       order by created_at desc limit 29);\n  end if;\n  return new;\nend;\n$$;\n\ndrop trigger if exists mk_backups_prune on public.mk_backups;\ncreate trigger mk_backups_prune\n  before insert on public.mk_backups\n  for each row execute function public.mk_backups_prune();\n";
/* ---------- النسخ الاحتياطية السحابية (مضغوطة + مشفّرة) ---------- */
const BK_AUTO_KEY='mk_bk_auto',BK_ITER=150000;
function bkB64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function bkUnB64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function bkPipe(u,T){return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(T)).arrayBuffer())}
async function bkDerive(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:BK_ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function bkPack(obj,key,salt){const z=await bkPipe(new TextEncoder().encode(JSON.stringify(obj)),new CompressionStream('gzip'));const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,z));return 'MKB1.'+bkB64(salt)+'.'+bkB64(iv)+'.'+bkB64(ct)}
async function bkUnpack(str,pw){const p=String(str||'').split('.');if(p[0]!=='MKB1'||p.length!==4)throw new Error('نسخة غير صالحة');
 const key=await bkDerive(pw,bkUnB64(p[1]));let z;try{z=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:bkUnB64(p[2])},key,bkUnB64(p[3])))}catch(e){throw new Error('كلمة سر النسخة غير صحيحة')}
 return JSON.parse(new TextDecoder().decode(await bkPipe(z,new DecompressionStream('gzip'))))}
function bkCounts(d){const o={};for(const c of['products','sales','purchases','customers','suppliers','users','expenses','movements'])o[c]=(d[c]||[]).length;return o}
function bkErr(e){const m=String(e&&e.message||e);return /mk_backups/.test(m)&&/(does not exist|not find|schema cache)/i.test(m)?'NOTABLE':m}
function bkAuto(){try{return JSON.parse(localStorage.getItem(BK_AUTO_KEY)||'null')}catch(e){return null}}
async function bkCreate(key,salt,kind,note){if(!SYNC.on)throw new Error('اربط بـ Supabase أولاً');save();
 const snap=JSON.parse(JSON.stringify(DB)),payload=await bkPack(snap,key,salt);
 if(SYNC.mode==='user')await mkRpc('mk_backup_add',{p_token:SYNC.token,p_device:SYNC.tag||'',p_kind:kind,p_note:note||null,p_size:payload.length,p_counts:bkCounts(snap),p_payload:payload});
 else await api('POST','/rest/v1/mk_backups',[{store_id:SYNC.uid,device:SYNC.tag||'',kind,note:note||null,size:payload.length,counts:bkCounts(snap),payload}],{Prefer:'return=minimal'});
 return payload.length}
async function bkList(){if(SYNC.mode==='user')return(await mkRpc('mk_backup_list',{p_token:SYNC.token}))||[];return (await api('GET','/rest/v1/mk_backups?select=id,created_at,device,kind,note,size,counts&order=created_at.desc&limit=200'))||[]}
async function bkFetch(id){if(SYNC.mode==='user'){const p=await mkRpc('mk_backup_get',{p_token:SYNC.token,p_id:+id});if(!p)throw new Error('النسخة غير موجودة');return p}const r=(await api('GET','/rest/v1/mk_backups?select=payload&id=eq.'+encodeURIComponent(id)))||[];if(!r[0])throw new Error('النسخة غير موجودة');return r[0].payload}
function bkSize(n){n=+n||0;return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
async function bkWaitSync(){for(let i=0;i<150&&syncBusy;i++)await new Promise(r=>setTimeout(r,200))}
/* الاستعادة: تستبدل البيانات هنا ثم ترفعها للسحابة فتصل لكل الأجهزة */
async function bkApply(d){if(!d||!Array.isArray(d.users)||!Array.isArray(d.products))throw new Error('محتوى النسخة غير صالح');
 if(d.dropMov){const m={};for(const k in d.dropMov){const x=d.dropMov[k];m[x.p]=(m[x.p]||0)+(+x.q||0)}d.products.forEach(p=>{if(typeof p.qty0==='number')p.qty0=r2(p.qty0+(m[p.id]||0))})}
 if(SYNC.on){await bkWaitSync();await syncNow();await bkWaitSync()}
 DB=Object.assign(freshDB(),d);DB.dropMov={};ensureQty0();recalcQty();
 if(SYNC.on){for(const c in SHADOW)for(const id in SHADOW[c])SHADOW[c][id]='?';syncSave()}
 save();if(SYNC.on){await bkWaitSync();await syncNow();await bkWaitSync();if(SYNC.lastErr)throw new Error('تمت الاستعادة على هذا الجهاز لكن تعذّر رفعها للسحابة: '+SYNC.lastErr+' — ستُرفع تلقائياً عند عودة الاتصال')}}
function bkSqlBox(){const w=modal('🗄️ تجهيز النسخ الاحتياطية في Supabase',`<p style="line-height:1.9;margin-bottom:10px">جدول النسخ الاحتياطية غير موجود بعد. افتح <b>Supabase ← SQL Editor ← New query</b>، الصق الكود التالي واضغط <b>Run</b> مرة واحدة فقط، ثم ارجع وجرّب.</p>
 <textarea readonly style="width:100%;height:220px;direction:ltr;text-align:left;font-family:monospace;font-size:12px">${esc(BACKUP_SQL)}</textarea>

 w.querySelector('#bqN').onclick=w.close;w.querySelector('#bqC').onclick=()=>{navigator.clipboard.writeText(BACKUP_SQL).then(()=>toast('تم نسخ الكود','ok'),()=>{w.querySelector('textarea').select();document.execCommand('copy');toast('تم نسخ الكود','ok')})};

  try{const salt=crypto.getRandomValues(new Uint8Array(16)),key=await bkDerive(f.p1,salt);const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));

const prodKey=n=>normName(n).replace(/\s+/g,'');
function findProductByName(name,exceptId){const k=prodKey(name);return k?DB.products.find(x=>x.id!==exceptId&&prodKey(x.name)===k):null}
function prodUsage(id){let n=0;DB.sales.forEach(s=>s.items.forEach(i=>{if(i.pid===id)n++}));DB.purchases.forEach(p=>(p.items||[]).forEach(i=>{if(i.pid===id)n++}));return n}
function dupProductGroups(){const g={};DB.products.forEach(p=>{const k=prodKey(p.name);if(k)(g[k]=g[k]||[]).push(p)});
 return Object.values(g).filter(a=>a.length>1).map(a=>a.slice().sort((x,y)=>(prodUsage(y.id)-prodUsage(x.id))||String(x.created||'').localeCompare(String(y.created||''))))}
function mergeProducts(keep,dups){ensureQty0();const ids=new Set(dups.map(d=>d.id));
 for(const d of dups){keep.qty0=r2((+keep.qty0||0)+(+d.qty0||0));
  if(d.barcode){if(!keep.barcode)keep.barcode=d.barcode;else if(d.barcode!==keep.barcode){keep.altCodes=[...new Set([...(keep.altCodes||[]),d.barcode])]}}
  (d.altCodes||[]).forEach(c=>{if(c!==keep.barcode)keep.altCodes=[...new Set([...(keep.altCodes||[]),c])]});
  if(!keep.supplierId&&d.supplierId)keep.supplierId=d.supplierId;keep.min=Math.max(+keep.min||0,+d.min||0);if(d.active!==false)keep.active=true}
 DB.movements.forEach(m=>{if(ids.has(m.pid))m.pid=keep.id});
 DB.sales.forEach(s=>{let ch=false;s.items.forEach(i=>{if(ids.has(i.pid)){i.pid=keep.id;ch=true}});(s.returns||[]).forEach(r=>(r.lines||[]).forEach(l=>{if(ids.has(l.pid))l.pid=keep.id}))});
 DB.purchases.forEach(p=>(p.items||[]).forEach(i=>{if(ids.has(i.pid))i.pid=keep.id}));
 const dm=DB.dropMov||{};for(const k in dm)if(ids.has(dm[k].p))dm[k].p=keep.id;
 if(typeof cart!=='undefined'&&Array.isArray(cart))cart.forEach(c=>{if(ids.has(c.pid))c.pid=keep.id});
 DB.products=DB.products.filter(p=>!ids.has(p.id));recalcQty()}

function translitAr(s){const M={'ا':'a','أ':'a','إ':'i','آ':'aa','ب':'b','ت':'t','ث':'th','ج':'j','ح':'h','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','ة':'a','و':'w','ي':'y','ى':'a','ء':'','ئ':'i','ؤ':'u'};
